<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Entry</title>

    <link rel="stylesheet" href="OrderEntry.css">

</head>

<body>

<div class="container">

    <!-- Banner -->

    <div class="banner">

        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200"
             alt="Restaurant Banner">

        <div class="banner-text">
            <h1>🍽 ORDER ENTRY</h1>
            <p>Fresh Food • Fast Service • Happy Customers</p>
        </div>

    </div>

    <!-- Form -->

    <div class="form-section">

        <div class="row">
            <label>Customer Name</label>
            <input type="text"
                   id="customerName"
                   placeholder="Enter Customer Name">
        </div>

        <div class="row">
            <label>Table Number</label>
            <input type="number"
                   id="tableNumber"
                   placeholder="Enter Table Number">
        </div>

        <div class="row">
            <label>Category</label>

            <select id="category">

                <option value="">Select Category</option>

                <option value="BREAKFAST">🍳 Breakfast</option>

                <option value="LUNCH">🍛 Lunch</option>

                <option value="DINNER">🍽 Dinner</option>

                <option value="BEVERAGES">☕ Beverages</option>

            </select>

        </div>

        <div class="row">
            <label>Food Item</label>

            <select id="foodItem">

                <option value="">
                    Select Category First
                </option>

            </select>

        </div>

        <div class="row">
            <label>Quantity</label>

            <input type="number"
                   id="quantity"
                   placeholder="Enter Quantity">
        </div>

        <div class="row">
            <label>Price</label>

            <input type="number"
                   id="price"
                   readonly>
        </div>

        <div class="row">
            <label>Total</label>

            <input type="number"
                   id="total"
                   readonly>
        </div>

        <div class="button-row">

            <button id="addBtn">
                Add Item
            </button>

        </div>

    </div>

    <h2>ORDER ITEMS</h2>

    <table id="orderTable">

        <thead>

        <tr>

            <th>Category</th>

            <th>Food Item</th>

            <th>Quantity</th>

            <th>Price</th>

            <th>Total</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

    <div class="grand-total">

        <label>Grand Total</label>

        <input type="text"
               id="grandTotal"
               readonly>

    </div>

    <div class="bottom-buttons">

        <button id="saveOrderBtn">
            Save Order
        </button>

        <button id="clearBtn">
            Clear
        </button>

        <button id="dashboardBtn">
            Dashboard
        </button>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<script src="OrderEntry.js"></script>

</body>

</html>
